[package]
name = "mhm-game"
version = "0.1.0"
description = "MINI-HUNGRY-MONSTERS: idle NFT mining + turn-based battle game on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mhm_game"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
