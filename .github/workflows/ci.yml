name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check program compiles
        run: cargo check -p mhm-game
      - name: Combat engine unit tests
        run: cargo test -p mhm-game --lib
